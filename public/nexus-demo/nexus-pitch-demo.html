<meta charset="utf-8">
<title>Nexus Empresarial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">

<style>
  :root{
    --bg:#050A12; --bg2:#0A1020; --sf:#0E1726; --sf2:#13203A;
    --bd:#1A2D4D; --bd2:#243B5C;
    --t:#EAF0FA; --t2:#A0B4CF; --t3:#6880A0; --t4:#3E5575;
    --ac:#00E4B8; --bl:#4A90FF; --am:#FFB020; --rd:#FF5050; --vi:#A06CFF;
    --font-display:'Inter','Segoe UI',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  body[data-nx-mode="light"]{
    --bg:#F6F8FB; --bg2:#EBEFF5; --sf:#FFFFFF; --sf2:#F3F5F9;
    --bd:#DCE3EE; --bd2:#C2CCDD;
    --t:#111827; --t2:#3E4C63; --t3:#67748A; --t4:#93A0B4;
    --ac:#00967D; --bl:#2563EB; --am:#B25B00; --rd:#DC2C46; --vi:#7C3AED;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--t);}
  body{font-family:var(--font-display);}
  ::selection{background:var(--ac);color:var(--bg);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg2);}
  ::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px;border:2px solid var(--bg2);}
  ::-webkit-scrollbar-thumb:hover{background:var(--t4);}
  h1,h2{text-wrap:balance;}
  button,input,select{font-family:inherit;}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{
    outline:2px solid var(--ac);outline-offset:2px;
  }
  .nx-scroll{scroll-behavior:smooth;}
  .nx-num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}

  @keyframes nxShimmer{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
  @keyframes nxPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.94)}}
  @keyframes nxFadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nxSpin{to{transform:rotate(360deg)}}
  @keyframes nxProgress{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

  .nx-skel{background:linear-gradient(90deg,var(--bd) 25%,var(--bd2) 37%,var(--bd) 63%);background-size:400% 100%;animation:nxShimmer 1.4s ease infinite;border-radius:6px;}
  .nx-row-new{animation:nxFadeIn .5s ease;background:rgba(0,228,184,.07);}
  .nx-spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.22);border-top-color:currentColor;display:inline-block;animation:nxSpin .7s linear infinite;vertical-align:-2px;}
  body[data-nx-mode="light"] .nx-spin{border-color:rgba(0,0,0,.15);}
  body[data-nx-mode="light"] .nx-overlay{background:rgba(15,23,42,.45);}
  .nx-progress-track{position:relative;overflow:hidden;height:3px;background:var(--bd);border-radius:2px;}
  .nx-progress-fill{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:nxProgress 1.1s ease-in-out infinite;}

  .nx-toggle{position:relative;display:inline-flex;width:38px;height:20px;flex-shrink:0;}
  .nx-toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .nx-toggle .trk{position:absolute;inset:0;background:var(--bd);border-radius:20px;transition:background .2s ease;pointer-events:none;}
  .nx-toggle .trk:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--t3);border-radius:50%;transition:transform .2s ease,background .2s ease;}
  .nx-toggle input:checked + .trk{background:rgba(0,228,184,.28);}
  .nx-toggle input:checked + .trk:before{transform:translateX(18px);background:var(--ac);}
  .nx-toggle input:focus-visible + .trk{outline:2px solid var(--ac);outline-offset:2px;}

  .nx-overlay{position:fixed;inset:0;background:rgba(2,5,10,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;animation:nxFadeIn .18s ease;}
  .nx-modal{background:var(--sf);border:1px solid var(--bd2);border-radius:12px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);}

  .nx-input{width:100%;background:var(--bg2);border:1px solid var(--bd);color:var(--t);border-radius:6px;padding:9px 11px;font-size:13px;transition:border-color .15s ease;}
  .nx-input:focus{border-color:var(--ac);}
  .nx-check{width:16px;height:16px;accent-color:var(--ac);}

  .nx-card-hover{transition:border-color .18s ease,transform .18s ease;}
  .nx-card-hover:hover{border-color:var(--bd2);transform:translateY(-2px);}
  .nx-btn{cursor:pointer;transition:filter .15s ease,transform .1s ease;}
  .nx-btn:hover{filter:brightness(1.12);}
  .nx-btn:active{transform:scale(.97);}
  .nx-btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;}

  @media (prefers-reduced-motion: reduce){
    .nx-scroll{scroll-behavior:auto !important;}
    .nx-skel{animation:none;background:var(--bd);}
    .nx-row-new{animation:none;}
    .nx-spin{animation:nxSpin 1.6s steps(8) infinite;}
    .nx-progress-fill{animation:none;left:0;width:100%;}
    *{transition-duration:.001ms !important;}
  }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext } = React;

// ═══════════════════════════════════════════════════════════════════
// CAPABILITY: downloads — la vista solo puede OFRECER un archivo vía
// window.claude.use("downloads"); un <a download>/href blob: no hace
// nada para el visor real del artifact.
// ═══════════════════════════════════════════════════════════════════
const DownloadsContext = createContext(null);

function DownloadsProvider({ children }) {
  const [api, setApi] = useState(null);
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        if (typeof window !== "undefined" && window.claude && typeof window.claude.use === "function") {
          const ns = await window.claude.use("downloads");
          if (alive) setApi(() => ns);
        }
      } catch (e) { /* queda null — se diseña para su ausencia */ }
    })();
    return () => { alive = false; };
  }, []);
  return <DownloadsContext.Provider value={api}>{children}</DownloadsContext.Provider>;
}
const useDownloads = () => useContext(DownloadsContext);

/** Convierte una blob: URL creada en esta misma página a Blob real (no navega, solo lee memoria). */
async function blobFromObjectUrl(url) {
  const resp = await fetch(url);
  return resp.blob();
}

/*
  NEXUS EMPRESARIAL — Interactive Pitch & Live Demo
  Original presentation preserved. The "Demo" section has been extended
  with a real role-based login, live data entry (add recurso / add
  usuario), an approval queue that mutates state, and branded loading
  transitions — the "carga de datos y usuarios" improvements.
*/

// ═══════════════════════════════════════════════════════════════════
// PALETTE & TOKENS — dos estilos de presentación (oscuro / claro)
// ═══════════════════════════════════════════════════════════════════
const DARK_PALETTE = {
  bg: "#050A12", bg2: "#0A1020", sf: "#0E1726", sf2: "#13203A",
  bd: "#1A2D4D", bd2: "#243B5C",
  t: "#EAF0FA", t2: "#A0B4CF", t3: "#6880A0", t4: "#3E5575",
  ac: "#00E4B8", ac2: "rgba(0,228,184,.08)", ac3: "rgba(0,228,184,.20)",
  bl: "#4A90FF", bl2: "rgba(74,144,255,.10)",
  am: "#FFB020", am2: "rgba(255,176,32,.10)",
  rd: "#FF5050", rd2: "rgba(255,80,80,.10)",
  vi: "#A06CFF", vi2: "rgba(160,108,255,.10)",
};
const LIGHT_PALETTE = {
  bg: "#F6F8FB", bg2: "#EBEFF5", sf: "#FFFFFF", sf2: "#F3F5F9",
  bd: "#DCE3EE", bd2: "#C2CCDD",
  t: "#111827", t2: "#3E4C63", t3: "#67748A", t4: "#93A0B4",
  ac: "#00967D", ac2: "rgba(0,150,125,.09)", ac3: "rgba(0,150,125,.18)",
  bl: "#2563EB", bl2: "rgba(37,99,235,.09)",
  am: "#B25B00", am2: "rgba(178,91,0,.09)",
  rd: "#DC2C46", rd2: "rgba(220,44,70,.09)",
  vi: "#7C3AED", vi2: "rgba(124,58,237,.09)",
};
// Objeto mutable: todos los componentes leen P.xxx en cada render.
// App() reescribe sus propiedades según el modo elegido antes de
// que se rendericen los hijos, sin necesitar Context en cada componente.
const P = { ...DARK_PALETTE };

// ═══════════════════════════════════════════════════════════════════
// MICRO COMPONENTS
// ═══════════════════════════════════════════════════════════════════
const ease = "all .4s cubic-bezier(.4,0,.2,1)";

const Badge = ({ c = P.ac, children }) => (
  <span style={{ display: "inline-flex", padding: "3px 10px", borderRadius: 4, fontSize: 10, fontWeight: 700, letterSpacing: ".05em", textTransform: "uppercase", color: c, background: `${c}18` }}>{children}</span>
);

const Bar = ({ v, mx, c = P.ac, h = 5 }) => (
  <div style={{ background: P.bd, borderRadius: h, height: h, width: "100%", overflow: "hidden" }}>
    <div style={{ width: `${mx ? (v / mx) * 100 : 0}%`, height: "100%", background: c, borderRadius: h, transition: "width 1s ease" }} />
  </div>
);

const Glow = ({ c = P.ac, size = 300, x = "50%", y = "50%", opacity = 0.06 }) => (
  <div style={{ position: "absolute", left: x, top: y, width: size, height: size, borderRadius: "50%", background: c, filter: `blur(${size / 2}px)`, opacity, transform: "translate(-50%,-50%)", pointerEvents: "none" }} />
);

const Spinner = ({ c }) => <span className="nx-spin" style={{ color: c || "currentColor" }} />;

const ProgressPulse = ({ label }) => (
  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12, padding: "56px 20px" }}>
    <div style={{ width: 44, height: 44, borderRadius: 12, background: `linear-gradient(135deg,${P.ac},${P.bl})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, fontWeight: 800, color: P.bg, animation: "nxPulse 1.1s ease-in-out infinite" }}>N</div>
    <div style={{ fontSize: 12, color: P.t3 }}>{label}</div>
    <div className="nx-progress-track" style={{ width: 170 }}><div className="nx-progress-fill" /></div>
  </div>
);

// ═══════════════════════════════════════════════════════════════════
// SHARED FORM PIECES
// ═══════════════════════════════════════════════════════════════════
const Field = ({ label, children }) => (
  <label style={{ display: "block", marginBottom: 14 }}>
    <div style={{ fontSize: 10, color: P.t4, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 6, fontWeight: 700 }}>{label}</div>
    {children}
  </label>
);

const ReasonPrompt = ({ placeholder, confirmLabel, confirmColor, onConfirm, onCancel }) => {
  const [text, setText] = useState("");
  return (
    <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 8 }}>
      <textarea
        className="nx-input"
        rows={2}
        placeholder={placeholder}
        value={text}
        onChange={e => setText(e.target.value)}
        style={{ resize: "vertical" }}
      />
      <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
        <button type="button" onClick={onCancel} className="nx-btn" style={{ background: "transparent", border: `1px solid ${P.bd}`, color: P.t3, borderRadius: 5, padding: "6px 12px", fontSize: 11, cursor: "pointer" }}>Cancelar</button>
        <button type="button" onClick={() => text.trim() && onConfirm(text.trim())} disabled={!text.trim()} className="nx-btn" style={{ background: `${confirmColor}18`, color: confirmColor, border: `1px solid ${confirmColor}40`, borderRadius: 5, padding: "6px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>{confirmLabel}</button>
      </div>
    </div>
  );
};

const Modal = ({ title, onClose, children, accent = P.ac }) => (
  <div className="nx-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="nx-modal">
      <div style={{ height: 3, background: accent }} />
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px", borderBottom: `1px solid ${P.bd}` }}>
        <span style={{ fontSize: 14, fontWeight: 700 }}>{title}</span>
        <button onClick={onClose} className="nx-btn" style={{ background: "transparent", border: "none", color: P.t3, fontSize: 18, cursor: "pointer", lineHeight: 1, padding: 4 }} aria-label="Cerrar">✕</button>
      </div>
      <div style={{ padding: 20 }}>{children}</div>
    </div>
  </div>
);

// ═══════════════════════════════════════════════════════════════════
// NAV BAR (persistent top bar)
// ═══════════════════════════════════════════════════════════════════
const TopBar = ({ section, setSection, sections, mode, onToggleMode }) => (
  <div style={{
    position: "fixed", top: 0, left: 0, right: 0, height: 52, zIndex: 50,
    background: mode === "light" ? "rgba(255,255,255,.85)" : "rgba(5,10,18,.85)", backdropFilter: "blur(16px)",
    borderBottom: `1px solid ${P.bd}`, display: "flex", alignItems: "center",
    padding: "0 28px", gap: 8,
  }}>
    <div style={{ display: "flex", alignItems: "center", gap: 8, marginRight: 28 }}>
      <div style={{ width: 28, height: 28, borderRadius: 6, background: `linear-gradient(135deg,${P.ac},${P.bl})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 800, color: P.bg }}>N</div>
      <span style={{ fontSize: 13, fontWeight: 700, letterSpacing: ".02em" }}>NEXUS</span>
      <span style={{ fontSize: 8, color: P.t3, letterSpacing: ".12em", marginTop: 1 }}>EMPRESARIAL</span>
    </div>
    <div style={{ display: "flex", gap: 2, flex: 1, overflowX: "auto" }}>
      {sections.map(s => (
        <div key={s.id} onClick={() => setSection(s.id)} className="nx-btn" style={{
          padding: "6px 14px", borderRadius: 4, fontSize: 12, cursor: "pointer", whiteSpace: "nowrap",
          color: section === s.id ? P.ac : P.t3, fontWeight: section === s.id ? 600 : 400,
          background: section === s.id ? P.ac2 : "transparent", transition: ease,
        }}>{s.label}</div>
      ))}
    </div>
    <button
      onClick={onToggleMode}
      className="nx-btn"
      title="Cambiar estilo de presentación"
      style={{ background: P.bg2, border: `1px solid ${P.bd}`, color: P.t2, borderRadius: 20, padding: "5px 12px", fontSize: 11, fontWeight: 600, cursor: "pointer", marginRight: 12, whiteSpace: "nowrap" }}
    >
      {mode === "light" ? "Modo oscuro" : "Modo claro"}
    </button>
    <div style={{ fontSize: 10, color: P.t4, whiteSpace: "nowrap" }}>v2.2 · Agosto 2026</div>
  </div>
);

// ═══════════════════════════════════════════════════════════════════
// SECTION: HERO
// ═══════════════════════════════════════════════════════════════════
const Hero = ({ onNext }) => {
  const [show, setShow] = useState(false);
  useEffect(() => { const t = setTimeout(() => setShow(true), 100); return () => clearTimeout(t); }, []);
  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden" }}>
      <Glow c={P.ac} size={600} x="30%" y="60%" opacity={0.04} />
      <Glow c={P.bl} size={500} x="70%" y="30%" opacity={0.03} />
      <div style={{ maxWidth: 800, textAlign: "center", opacity: show ? 1 : 0, transform: show ? "translateY(0)" : "translateY(30px)", transition: "all .8s ease", padding: "0 20px" }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 16, marginBottom: 32 }}>
          <div style={{ width: 64, height: 64, borderRadius: 14, background: `linear-gradient(135deg,${P.ac},${P.bl})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 32, fontWeight: 800, color: P.bg, boxShadow: `0 0 60px ${P.ac}30` }}>N</div>
        </div>
        <h1 style={{ fontSize: 56, fontWeight: 800, lineHeight: 1.1, margin: "0 0 8px", letterSpacing: "-.01em" }}>
          NEXUS <span style={{ color: P.ac }}>EMPRESARIAL</span>
        </h1>
        <p style={{ fontSize: 14, color: P.t3, letterSpacing: ".18em", textTransform: "uppercase", margin: "0 0 32px" }}>
          Plataforma de Gestión de Auditoría SRC-YPF
        </p>
        <p style={{ fontSize: 19, color: P.t2, lineHeight: 1.6, maxWidth: 600, margin: "0 auto 40px" }}>
          Una plataforma que centraliza el compliance de contratistas para YPF.
          Tres empresas. Tres subcontratos. Un solo panel de control.
        </p>
        <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
          <button onClick={() => onNext()} className="nx-btn" style={{
            background: P.ac, color: P.bg, border: "none", padding: "12px 32px",
            borderRadius: 8, fontWeight: 700, fontSize: 15, cursor: "pointer",
            boxShadow: `0 0 30px ${P.ac}25`,
          }}>Explorar la Propuesta →</button>
          <button onClick={() => onNext("demo")} className="nx-btn" style={{
            background: "transparent", color: P.ac, border: `1px solid ${P.ac}40`,
            padding: "12px 28px", borderRadius: 8, fontWeight: 600, fontSize: 15, cursor: "pointer",
          }}>Ver Demo en Vivo</button>
        </div>
        <div style={{ marginTop: 48, display: "flex", gap: 40, justifyContent: "center", flexWrap: "wrap" }}>
          {[{ n: "3", l: "Subcontratos" }, { n: "48", l: "Recursos gestionados" }, { n: "9", l: "Módulos" }, { n: "4", l: "Roles de acceso" }].map((s, i) => (
            <div key={i} style={{ textAlign: "center" }}>
              <div className="nx-num" style={{ fontSize: 28, fontWeight: 700, color: P.ac }}>{s.n}</div>
              <div style={{ fontSize: 11, color: P.t4, marginTop: 2 }}>{s.l}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// SECTION: PROBLEMA
// ═══════════════════════════════════════════════════════════════════
const Problema = () => (
  <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", padding: "80px 60px", position: "relative" }}>
    <Glow c={P.rd} size={400} x="80%" y="20%" opacity={0.03} />
    <div style={{ maxWidth: 1100, width: "100%" }}>
      <Badge c={P.rd}>El Desafío</Badge>
      <h2 style={{ fontSize: 38, fontWeight: 800, margin: "12px 0 8px", lineHeight: 1.15 }}>
        El compliance fragmentado<br />cuesta <span style={{ color: P.rd }}>tiempo, dinero y acceso</span>
      </h2>
      <p style={{ fontSize: 16, color: P.t2, maxWidth: 600, lineHeight: 1.6, marginBottom: 36 }}>
        Las empresas contratistas de YPF enfrentan un proceso complejo de auditoría
        a través del Sistema de Recursos Contratados (SRC 3.0). Sin una herramienta
        centralizada, cada gestión es un riesgo.
      </p>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        {[
          { icon: "⚠", title: "Vencimientos no detectados", desc: "ART, aptos médicos y seguros vencen sin aviso. El recurso queda bloqueado y la empresa pierde días de operación.", stat: "45 días", statL: "de anticipación necesaria" },
          { icon: "✕", title: "Altas ARCA omitidas", desc: "Sin Alta Temprana en ARCA (ex AFIP), el trabajador no puede ingresar a planta. Las multas por omisión son graves.", stat: "48hs", statL: "plazo de auditoría para altas" },
          { icon: "◎", title: "Sin trazabilidad formal", desc: "Las Órdenes de Servicio (OS) y Pedidos de Empresa (PE) quedan dispersos en emails sin registro legal.", stat: "0%", statL: "trazabilidad sin sistema" },
          { icon: "▤", title: "Documentación duplicada", desc: "Cada empresa repite el proceso de carga en SRC-Digitalización sin saber qué falta o qué fue rechazado.", stat: "72hs", statL: "plazo de auditoría para bajas" },
        ].map((p, i) => (
          <div key={i} style={{ background: P.sf, border: `1px solid ${P.bd}`, borderRadius: 8, padding: 24, display: "flex", gap: 16 }}>
            <div style={{ width: 40, height: 40, borderRadius: 8, background: P.rd2, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, color: P.rd, flexShrink: 0 }}>{p.icon}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 6 }}>{p.title}</div>
              <div style={{ fontSize: 13, color: P.t3, lineHeight: 1.5, marginBottom: 12 }}>{p.desc}</div>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                <span className="nx-num" style={{ fontSize: 24, fontWeight: 700, color: P.am }}>{p.stat}</span>
                <span style={{ fontSize: 11, color: P.t4 }}>{p.statL}</span>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  </div>
);

// ═══════════════════════════════════════════════════════════════════
// SECTION: SOLUCIÓN
// ═══════════════════════════════════════════════════════════════════
const Solucion = () => (
  <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", padding: "80px 60px", position: "relative" }}>
    <Glow c={P.ac} size={500} x="20%" y="50%" opacity={0.04} />
    <div style={{ maxWidth: 1100, width: "100%" }}>
      <Badge c={P.ac}>La Solución</Badge>
      <h2 style={{ fontSize: 38, fontWeight: 800, margin: "12px 0 8px", lineHeight: 1.15 }}>
        NEXUS centraliza todo el flujo<br />de compliance <span style={{ color: P.ac }}>en una plataforma</span>

// DEMO — ADJUNTAR ARCHIVO (PDF / Word / Excel / otro)
// ═══════════════════════════════════════════════════════════════════
const MAX_FILE_MB = 15;
const FILE_ACCEPT = ".pdf,.doc,.docx,.xls,.xlsx,.csv,.png,.jpg,.jpeg,.txt";

function fileExt(name) {
  const m = /\.([a-zA-Z0-9]+)$/.exec(name || "");
  return m ? m[1].toUpperCase() : "ARCHIVO";
}
function fileTypeColor(ext) {
  const e = ext.toLowerCase();
  if (e === "pdf") return P.rd;
  if (e === "doc" || e === "docx") return P.bl;
  if (e === "xls" || e === "xlsx" || e === "csv") return P.ac;
  return P.t3;
}
function fmtBytes(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

const REVISION_LABEL = { Pendiente: "Pendiente de revisión", Visado: "Visado", Observado: "Con observaciones", Rechazado: "Rechazado" };
const REVISION_COLOR = () => ({ Pendiente: P.t4, Visado: P.ac, Observado: P.am, Rechazado: P.rd });

const FilePreview = ({ f }) => {
  const [state, setState] = useState({ status: "idle" }); // idle | loading | text | image | unsupported | error

  const load = async () => {
    setState({ status: "loading" });
    try {
      const blob = await blobFromObjectUrl(f.url);
      if (f.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = () => setState({ status: "image", src: reader.result });
        reader.onerror = () => setState({ status: "error" });
        reader.readAsDataURL(blob);
      } else if (f.type.startsWith("text/")) {
        const text = await blob.text();
        setState({ status: "text", text });
      } else {
        setState({ status: "unsupported" });
      }
    } catch (e) { setState({ status: "error" }); }
  };

  if (state.status === "idle") {
    return (
      <button type="button" onClick={load} className="nx-btn" style={{ background: "transparent", border: "none", color: P.bl, fontWeight: 600, fontSize: 10.5, cursor: "pointer", padding: 0, textDecoration: "underline", textUnderlineOffset: 2 }}>Vista previa</button>
    );
  }
  return (
    <div style={{ marginTop: 6 }}>
      {state.status === "loading" && <Spinner c={P.t3} />}
      {state.status === "image" && <img src={state.src} alt={f.name} style={{ maxWidth: "100%", maxHeight: 220, borderRadius: 6, border: `1px solid ${P.bd}`, display: "block" }} />}
      {state.status === "text" && <pre style={{ margin: 0, fontFamily: "var(--font-mono)", fontSize: 10.5, color: P.t2, background: P.bg, border: `1px solid ${P.bd}`, borderRadius: 6, padding: 8, whiteSpace: "pre-wrap", wordBreak: "break-word", maxHeight: 160, overflowY: "auto" }}>{state.text}</pre>}
      {state.status === "unsupported" && <div style={{ fontSize: 10.5, color: P.t4 }}>Vista previa no disponible para este tipo de archivo — usá Descargar.</div>}
      {state.status === "error" && <div style={{ fontSize: 10.5, color: P.rd }}>No se pudo cargar la vista previa.</div>}
    </div>
  );
};

const DownloadButton = ({ f }) => {
  const downloads = useDownloads();
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const handleDownload = async () => {
    if (!downloads) return;
    setBusy(true);
    setMsg("");
    try {
      const blob = await blobFromObjectUrl(f.url);
      await downloads.save({ filename: f.name, data: blob });
      setMsg("Guardado.");
    } catch (e) {
      setMsg(e && e.code === "declined" ? "" : "No se pudo descargar.");
    } finally {
      setBusy(false);
      setTimeout(() => setMsg(""), 2500);
    }
  };

  if (!downloads) {
    return <span style={{ fontSize: 10, color: P.t4 }} title="La descarga no está disponible en esta vista">Descarga no disponible</span>;
  }
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
      <button type="button" onClick={handleDownload} disabled={busy} className="nx-btn" style={{ background: "transparent", border: "none", color: P.bl, fontWeight: 600, fontSize: 10.5, cursor: "pointer", padding: 0, textDecoration: "underline", textUnderlineOffset: 2 }}>
        {busy ? <Spinner c={P.bl} /> : "Descargar"}
      </button>
      {msg && <span style={{ fontSize: 10, color: P.t4 }}>{msg}</span>}
    </span>
  );
};

const FileAttach = ({ files, onAdd, onRemove, compact, canReview, onReview }) => {
  const inputRef = useRef(null);
  const [error, setError] = useState("");
  const [reviewing, setReviewing] = useState(null); // { idx, estado }
  const revColor = REVISION_COLOR();

  const handleFiles = (fileList) => {
    const picked = Array.from(fileList || []);
    if (picked.length === 0) return;
    const tooBig = picked.find(f => f.size > MAX_FILE_MB * 1024 * 1024);
    if (tooBig) {
      setError(`"${tooBig.name}" supera ${MAX_FILE_MB} MB. Elegí un archivo más liviano.`);
      return;
    }
    setError("");
    onAdd(picked.map(f => {
      let url = "";
      try { url = URL.createObjectURL(f); } catch (e) { /* sin soporte de blobs */ }
      return { name: f.name, size: f.size, type: f.type, url, revision: { estado: "Pendiente" } };
    }));
  };

  const startReview = (idx, estado) => {
    if (estado === "Visado") { onReview(idx, estado, ""); return; }
    setReviewing({ idx, estado });
  };

  return (
    <div>
      <input
        ref={inputRef}
        type="file"
        multiple
        accept={FILE_ACCEPT}
        style={{ display: "none" }}
        onChange={e => { handleFiles(e.target.files); e.target.value = ""; }}
      />
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <button
          type="button"
          onClick={() => inputRef.current && inputRef.current.click()}
          className="nx-btn"
          style={{ background: P.bl2, color: P.bl, border: `1px solid ${P.bl}40`, borderRadius: 6, padding: compact ? "5px 10px" : "8px 14px", fontSize: compact ? 11 : 12.5, fontWeight: 700, cursor: "pointer" }}
        >
          + Adjuntar Archivo
        </button>
        <span style={{ fontSize: 10, color: P.t4 }}>PDF, Word, Excel u otro · máx. {MAX_FILE_MB} MB</span>
      </div>
      {error && <div style={{ fontSize: 11, color: P.rd, marginTop: 8 }}>{error}</div>}
      {files.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 10 }}>
          {files.map((f, i) => {
            const rev = f.revision || { estado: "Pendiente" };
            return (
              <div key={i} style={{ background: P.bg2, border: `1px solid ${P.bd}`, borderRadius: 6, padding: "8px 10px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <Badge c={fileTypeColor(fileExt(f.name))}>{fileExt(f.name)}</Badge>
                  <span style={{ flex: 1, minWidth: 80, fontSize: 11.5, color: P.t2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</span>
                  <span className="nx-num" style={{ fontSize: 10, color: P.t4, flexShrink: 0 }}>{fmtBytes(f.size)}</span>
                  {f.url && <FilePreview f={f} />}
                  {f.url && <DownloadButton f={f} />}
                  {onRemove && (
                    <button type="button" onClick={() => onRemove(i)} className="nx-btn" style={{ background: "transparent", border: "none", color: P.t3, cursor: "pointer", fontSize: 13, lineHeight: 1, padding: 2, flexShrink: 0 }} aria-label={`Quitar ${f.name}`}>✕</button>
                  )}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6, flexWrap: "wrap" }}>
                  <Badge c={revColor[rev.estado]}>{REVISION_LABEL[rev.estado]}</Badge>
                  {rev.comentario && <span style={{ fontSize: 10.5, color: P.t3 }}>&ldquo;{rev.comentario}&rdquo;</span>}
                  {rev.revisor && <span style={{ fontSize: 10, color: P.t4 }}>— {rev.revisor}{rev.fecha ? ` · ${rev.fecha}` : ""}</span>}
                </div>
                {canReview && rev.estado === "Pendiente" && (
                  reviewing && reviewing.idx === i ? (
                    <ReasonPrompt
                      placeholder={reviewing.estado === "Observado" ? "Detalle la observación para la empresa…" : "Motivo del rechazo…"}
                      confirmLabel={reviewing.estado === "Observado" ? "Enviar observación" : "Confirmar rechazo"}
                      confirmColor={reviewing.estado === "Observado" ? P.am : P.rd}
                      onCancel={() => setReviewing(null)}
                      onConfirm={(text) => { onReview(i, reviewing.estado, text); setReviewing(null); }}
                    />
                  ) : (
                    <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                      <button type="button" onClick={() => startReview(i, "Visado")} className="nx-btn" style={{ background: P.ac2, color: P.ac, border: `1px solid ${P.ac}40`, borderRadius: 5, padding: "5px 11px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}>Visar</button>
                      <button type="button" onClick={() => startReview(i, "Observado")} className="nx-btn" style={{ background: P.am2, color: P.am, border: `1px solid ${P.am}40`, borderRadius: 5, padding: "5px 11px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}>Observar</button>
                      <button type="button" onClick={() => startReview(i, "Rechazado")} className="nx-btn" style={{ background: P.rd2, color: P.rd, border: `1px solid ${P.rd}40`, borderRadius: 5, padding: "5px 11px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}>Rechazar</button>
                    </div>
                  )
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

// GRÁFICAS — donut SVG y barras horizontales
// ═══════════════════════════════════════════════════════════════════
const Donut = ({ segments, size = 128, thickness = 16 }) => {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label="Distribución de estados">
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={P.bd} strokeWidth={thickness} />
      {segments.filter(s => s.value > 0).map((s, i) => {
        const frac = s.value / total;
        const dash = frac * c;
        const dashoffset = -offset;
        offset += dash;
        return (
          <circle
            key={i}
            cx={size / 2} cy={size / 2} r={r} fill="none"
            stroke={s.color} strokeWidth={thickness}
            strokeDasharray={`${dash} ${c - dash}`}
            strokeDashoffset={dashoffset}
            transform={`rotate(-90 ${size / 2} ${size / 2})`}
          />
        );
      })}
      <text x="50%" y="46%" textAnchor="middle" fontSize="22" fontWeight="800" fill={P.t} fontFamily="var(--font-mono)">{total}</text>
      <text x="50%" y="62%" textAnchor="middle" fontSize="9" fill={P.t4} letterSpacing=".05em">RECURSOS</text>
    </svg>
  );
};

const HBarChart = ({ rows, max = 100 }) => (

        <div style={{ position: "relative", height: 18, background: P.bg2, borderRadius: 4, overflow: "hidden" }}>
          <div style={{ position: "absolute", inset: 0, width: `${Math.min(100, (r.value / max) * 100)}%`, background: r.color, borderRadius: 4, transition: "width 1s ease" }} />

);

function rowsToCsv(rows) {
  return rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
}

const CsvDownloadButton = ({ csv, filename }) => {
  const downloads = useDownloads();
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const handleDownload = async () => {
    if (!downloads) return;
    setBusy(true);
    setMsg("");
    try {
      await downloads.save({ filename, data: csv });
      setMsg("Guardado.");
    } catch (e) {
      setMsg(e && e.code === "declined" ? "" : "No se pudo descargar.");
    } finally {
      setBusy(false);
      setTimeout(() => setMsg(""), 2500);
    }
  };

  if (!downloads) return <span style={{ fontSize: 10, color: P.t4 }}>Descarga no disponible</span>;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
      <button type="button" onClick={handleDownload} disabled={busy} className="nx-btn" style={{ background: "transparent", border: "none", color: P.bl, fontWeight: 600, fontSize: 10.5, cursor: "pointer", padding: 0, textDecoration: "underline", textUnderlineOffset: 2, flexShrink: 0 }}>

      </button>
      {msg && <span style={{ fontSize: 10, color: P.t4 }}>{msg}</span>}
    </span>
  );
};

/** Deriva alertas urgentes (0–45 días) y de planificación (46–90 días) a partir del personal. Reutilizado por AlertasTab y ReportesTab. */
function computeAlertas(personal, empresaFiltro) {
  const urgentes = [];
  const futuras = [];
  personal.forEach(p => {
    if (p.art < 0) urgentes.push({ p: "critica", msg: `${p.nombre} — ART vencida, recurso BLOQUEADO`, t: "bloqueo", emp: p.emp });
    else if (p.art < 45) urgentes.push({ p: "alta", msg: `ART de ${p.nombre} vence en ${p.art} días`, t: "vencimiento", emp: p.emp });
    else if (p.art < 90) futuras.push({ p: "media", msg: `ART de ${p.nombre} vence en ${p.art} días`, t: "planificación", emp: p.emp });
    if (p.apto < 0) urgentes.push({ p: "critica", msg: `${p.nombre} — Apto médico vencido`, t: "documentación", emp: p.emp });
    else if (p.apto < 45) urgentes.push({ p: "alta", msg: `Apto médico de ${p.nombre} vence en ${p.apto} días`, t: "vencimiento", emp: p.emp });
    else if (p.apto < 90) futuras.push({ p: "media", msg: `Apto médico de ${p.nombre} vence en ${p.apto} días`, t: "planificación", emp: p.emp });
    if (!p.arca) urgentes.push({ p: "critica", msg: `${p.nombre} sin Alta ARCA — NO puede ingresar`, t: "documentación", emp: p.emp });
  });
  const all = [...urgentes, ...STATIC_ALERTS];
  const items = (empresaFiltro ? all.filter(a => !a.emp || a.emp === empresaFiltro) : all)
    .sort((a, b) => (a.p === "critica" ? 0 : a.p === "alta" ? 1 : 2) - (b.p === "critica" ? 0 : b.p === "alta" ? 1 : 2));
  const futItems = empresaFiltro ? futuras.filter(a => a.emp === empresaFiltro) : futuras;
  return { urgentes: items, futuras: futItems };
}

const AlertasTab = ({ personal, empresaFiltro }) => {
  const { urgentes: items, futuras: futItems } = computeAlertas(personal, empresaFiltro);

  return (
    <div>
      <div style={{ fontSize: 10, color: P.t4, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 8, fontWeight: 700 }}>Alertas activas (0–45 días)</div>

  );
};

// DEMO — TAB: REPORTES SEMANALES (Auditor / Cliente)
// Basado en la Guía Maestra YPF: plazos de auditoría (48hs altas,
// 72hs mensual/bajas), retenciones por incumplimiento (3%/5%) y el
// camino a "Empresa Promovida" (12 meses consecutivos sin incumplir).
// ═══════════════════════════════════════════════════════════════════
const TARGET_CUMPLIMIENTO = 90;

/** Historial semanal sintético de cumplimiento (%) previo a la semana actual, por alcance. */
const SEED_HISTORIAL_CUMPLIMIENTO = {
  "todas": [34, 38, 41, 44, 47, 48],
  "CODESIN S.A.": [42, 46, 50, 54, 57, 58],
  "TECFOR S.R.L.": [26, 30, 34, 38, 42, 46],
  "SERMAT S.A.": [0, 0, 0, 0, 0, 0],
};

const REPORTE_HOY = new Date("2026-08-28T12:00:00");

/** Regresión lineal simple sobre los últimos puntos para proyectar semanas hasta la meta. */
function projectWeeks(history, target) {
  const pts = history.slice(-4).map((v, i) => [i, v]);
  if (pts.length < 2) return { slope: 0, weeksToTarget: null };
  const meanX = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const meanY = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  const num = pts.reduce((s, [x, y]) => s + (x - meanX) * (y - meanY), 0);
  const den = pts.reduce((s, [x]) => s + (x - meanX) ** 2, 0) || 1;
  const slope = num / den;
  const last = history[history.length - 1];
  let weeksToTarget = null;
  if (slope > 0.4 && last < target) weeksToTarget = Math.ceil((target - last) / slope);
  return { slope, weeksToTarget };
}

function generarRecomendaciones(scoped, pct, target) {
  const vencidos = scoped.filter(p => p.art < 0 || p.apto < 0).length;
  const sinArca = scoped.filter(p => !p.arca).length;
  const rechazados = scoped.filter(p => p.estado === "Rechazado").length;
  const proximos = scoped.filter(p => (p.art >= 0 && p.art < 45) || (p.apto >= 0 && p.apto < 45)).length;
  const recs = [];
  if (vencidos > 0) recs.push({ nivel: "critica", texto: `Regularizar ${vencidos} recurso${vencidos > 1 ? "s" : ""} con documentación vencida (ART/Apto) esta semana — el 1er mes en falta retiene 3% del monto certificado, y 5% desde el 2do mes.` });
  if (sinArca > 0) recs.push({ nivel: "critica", texto: `Completar Alta Temprana ARCA de ${sinArca} recurso${sinArca > 1 ? "s" : ""} antes del ingreso — el Estudio Auditor responde altas y actualizaciones en hasta 48hs hábiles.` });
  if (rechazados > 0) recs.push({ nivel: "alta", texto: `Reingresar ${rechazados} documento${rechazados > 1 ? "s" : ""} rechazado${rechazados > 1 ? "s" : ""}; mensual y bajas se resuelven en hasta 72hs hábiles.` });
  if (proximos > 0) recs.push({ nivel: "alta", texto: `Anticipar la renovación de ${proximos} póliza${proximos > 1 ? "s" : ""}/apto${proximos > 1 ? "s" : ""} que vence${proximos > 1 ? "n" : ""} dentro de 45 días.` });
  if (pct < target) recs.push({ nivel: "media", texto: `Cumplimiento en ${pct}%, ${target - pct} puntos por debajo de la meta (${target}%) — priorizar el Plan de Acción.` });
  else recs.push({ nivel: "buena", texto: `Cumplimiento de ${pct}% ≥ meta (${target}%). Sostenerlo suma hacia "Empresa Promovida" (12 meses consecutivos sin incumplimientos → control trimestral).` });
  if (recs.length === 1 && pct >= target) recs.unshift({ nivel: "buena", texto: "Sin hallazgos críticos esta semana." });
  return recs;
}

function proximaSemanaAcciones(acciones, empresaFiltro) {
  const scoped = empresaFiltro ? acciones.filter(a => a.emp === empresaFiltro) : acciones;
  return scoped
    .filter(a => a.estado !== "Hecho")
    .map(a => ({ ...a, diffDays: Math.round((new Date(`${a.v}T00:00:00`) - REPORTE_HOY) / 86400000) }))
    .filter(a => a.diffDays <= 7)
    .sort((x, y) => x.diffDays - y.diffDays);
}

const REC_TONE = () => ({ critica: P.rd, alta: P.am, media: P.bl, buena: P.ac });

const TrendChart = ({ history, target = TARGET_CUMPLIMIENTO, width = 480, height = 150 }) => {
  const { slope, weeksToTarget } = projectWeeks(history, target);
  const projN = weeksToTarget !== null ? Math.min(6, weeksToTarget) : 0;
  const totalPts = history.length + projN;
  const padL = 26, padB = 6, padT = 10, padR = 8;
  const innerW = width - padL - padR, innerH = height - padT - padB;
  const xFor = (i) => padL + (i / Math.max(1, totalPts - 1)) * innerW;
  const yFor = (v) => padT + innerH - (Math.max(0, Math.min(100, v)) / 100) * innerH;
  const historyPts = history.map((v, i) => [xFor(i), yFor(v)]);
  const lastIdx = history.length - 1;
  const lastVal = history[lastIdx];
  const projPts = [];
  for (let k = 1; k <= projN; k++) projPts.push([xFor(lastIdx + k), yFor(Math.min(100, lastVal + slope * k))]);
  const path = (pts) => pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");

  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} role="img" aria-label="Tendencia de cumplimiento">
      {[0, 25, 50, 75, 100].map(v => (
        <g key={v}>
          <line x1={padL} x2={width - padR} y1={yFor(v)} y2={yFor(v)} stroke={P.bd} strokeWidth="1" />
          <text x={0} y={yFor(v) + 3} fontSize="8" fill={P.t4}>{v}</text>
        </g>
      ))}
      <line x1={padL} x2={width - padR} y1={yFor(target)} y2={yFor(target)} stroke={P.am} strokeWidth="1.5" strokeDasharray="4 3" />
      <text x={width - padR} y={yFor(target) - 4} fontSize="8" fill={P.am} textAnchor="end">Meta {target}%</text>
      {projPts.length > 0 && <path d={path([historyPts[historyPts.length - 1], ...projPts])} fill="none" stroke={P.bl} strokeWidth="2" strokeDasharray="5 4" strokeLinecap="round" />}
      <path d={path(historyPts)} fill="none" stroke={P.ac} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {historyPts.map(([x, y], i) => <circle key={i} cx={x} cy={y} r={i === historyPts.length - 1 ? 4 : 2.5} fill={P.ac} />)}
      {projPts.map(([x, y], i) => <circle key={i} cx={x} cy={y} r={2} fill={P.bl} />)}
    </svg>
  );
};

const ReportesTab = ({ personal, acciones, role, sessionEmpresa, historial, reportes, onGenerar, onEnviar, busyEnviar }) => {
  const [scope, setScope] = useState(role === "Empresa" ? sessionEmpresa : "todas");
  const scoped = scope === "todas" ? personal : personal.filter(p => p.emp === scope);
  const total = scoped.length;
  const avalados = scoped.filter(p => p.estado === "Avalado").length;
  const rechazados = scoped.filter(p => p.estado === "Rechazado").length;
  const pendientes = total - avalados - rechazados;
  const pct = total ? Math.round((avalados / total) * 100) : 0;

  const hist = [...(historial[scope] || []), pct];
  const { weeksToTarget } = projectWeeks(hist, TARGET_CUMPLIMIENTO);
  const { urgentes, futuras } = computeAlertas(scoped, scope === "todas" ? null : scope);
  const recomendaciones = generarRecomendaciones(scoped, pct, TARGET_CUMPLIMIENTO);
  const recTone = REC_TONE();
  const plan = proximaSemanaAcciones(acciones, scope === "todas" ? null : scope);
  const misReportes = reportes.filter(r => r.empresa === scope);

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <Badge c={scope === "todas" ? P.vi : P.bl}>{scope === "todas" ? "Reporte de Auditor" : "Reporte de Cliente"}</Badge>
          {role !== "Empresa" && (
            <select value={scope} onChange={e => setScope(e.target.value)} className="nx-input" style={{ width: "auto", padding: "6px 10px", fontSize: 11.5 }}>
              <option value="todas">Todas las empresas</option>
              {EMPRESAS_DATA.map(e => <option key={e.nombre} value={e.nombre}>{e.nombre}</option>)}
            </select>
          )}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={() => onGenerar(scope)} className="nx-btn" style={{ background: P.ac2, color: P.ac, border: `1px solid ${P.ac}40`, borderRadius: 5, padding: "7px 14px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Generar reporte de esta semana</button>
          {role !== "Empresa" && scope === "todas" && (
            <button onClick={onEnviar} disabled={busyEnviar} className="nx-btn" style={{ background: P.vi2, color: P.vi, border: `1px solid ${P.vi}40`, borderRadius: 5, padding: "7px 14px", fontSize: 11, fontWeight: 700, cursor: "pointer", minWidth: 190 }}>
              {busyEnviar ? <Spinner c={P.vi} /> : "Enviar a todos los subcontratos"}
            </button>
          )}
        </div>
      </div>

      {/* KPIs */}
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        {[{ l: "Recursos", v: total, c: P.t2 }, { l: "Avalados", v: avalados, c: P.ac }, { l: "Pendientes", v: pendientes, c: P.am }, { l: "Rechazados", v: rechazados, c: P.rd }, { l: "Cumplimiento", v: `${pct}%`, c: pct >= TARGET_CUMPLIMIENTO ? P.ac : P.am }, { l: "Meta", v: `${TARGET_CUMPLIMIENTO}%`, c: P.t3 }].map((s, i) => (
          <div key={i} style={{ flex: "1 1 100px", background: P.bg2, borderRadius: 6, padding: "12px 14px", borderTop: `3px solid ${s.c}` }}>
            <div style={{ fontSize: 9, color: P.t4, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 4 }}>{s.l}</div>
            <div className="nx-num" style={{ fontSize: 20, fontWeight: 700, color: s.c }}>{s.v}</div>
          </div>
        ))}
      </div>

      {/* Tendencia y proyección */}
      <div style={{ background: P.bg2, borderRadius: 6, padding: 14, marginBottom: 16 }}>
        <div style={{ fontSize: 10, color: P.t4, textTransform: "uppercase", letterSpacing: ".04em", marginBottom: 10 }}>Tendencia de cumplimiento — últimas {hist.length} semanas y proyección</div>
        <TrendChart history={hist} target={TARGET_CUMPLIMIENTO} />
        <p style={{ fontSize: 11, color: P.t3, marginTop: 8 }}>
          {pct >= TARGET_CUMPLIMIENTO
            ? `Cumplimiento por encima de la meta. Manteniendo el ritmo, suma hacia los 12 meses consecutivos para el estatus "Empresa Promovida".`
            : weeksToTarget !== null
              ? `Al ritmo actual, se proyecta alcanzar la meta de ${TARGET_CUMPLIMIENTO}% en aproximadamente ${weeksToTarget} semana${weeksToTarget > 1 ? "s" : ""} (línea punteada).`
              : `El ritmo actual no proyecta alcanzar la meta de ${TARGET_CUMPLIMIENTO}% — se requieren acciones correctivas del Plan de Acción.`}
        </p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
        {/* Alertas resumen */}
        <div>
          <div style={{ fontSize: 10, color: P.t4, textTransform: "uppercase", letterSpacing: ".04em", marginBottom: 8 }}>Alertas ({urgentes.length} activas · {futuras.length} en planificación)</div>
          {urgentes.length === 0 ? (
            <div style={{ fontSize: 11.5, color: P.t4, padding: "10px 0" }}>Sin alertas activas esta semana.</div>
          ) : (
            <div style={{ borderRadius: 6, overflow: "hidden", border: `1px solid ${P.bd}` }}>
              {urgentes.slice(0, 5).map((a, i) => <AlertRow key={i} a={a} />)}
            </div>
          )}
        </div>

        {/* Recomendaciones */}
        <div>
          <div style={{ fontSize: 10, color: P.t4, textTransform: "uppercase", letterSpacing: ".04em", marginBottom: 8 }}>Recomendaciones</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {recomendaciones.map((r, i) => (
              <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", borderLeft: `3px solid ${recTone[r.nivel]}`, background: `${recTone[r.nivel]}0d`, borderRadius: 4, padding: "8px 10px" }}>
                <span style={{ fontSize: 11, color: P.t2, lineHeight: 1.4 }}>{r.texto}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Planificación semana próxima */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 10, color: P.t4, textTransform: "uppercase", letterSpacing: ".04em", marginBottom: 8 }}>Planificación — próximos 7 días</div>
        {plan.length === 0 ? (
          <div style={{ fontSize: 11.5, color: P.t4 }}>Sin acciones vencidas ni previstas en los próximos 7 días.</div>
        ) : (
          <div style={{ borderRadius: 6, overflow: "hidden", border: `1px solid ${P.bd}` }}>
            {plan.map(a => (
              <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderTop: `1px solid ${P.bd}` }}>
                <Badge c={a.diffDays < 0 ? P.rd : a.p === "critica" ? P.rd : P.am}>{a.diffDays < 0 ? `Vencida (${Math.abs(a.diffDays)}d)` : a.diffDays === 0 ? "Hoy" : `En ${a.diffDays}d`}</Badge>
                <span style={{ flex: 1, fontSize: 11.5, color: P.t2 }}>{a.ac}</span>
                <span style={{ fontSize: 10, color: P.t4 }}>{a.resp}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Historial de reportes generados */}
      <div>
        <div style={{ fontSize: 10, color: P.t4, textTransform: "uppercase", letterSpacing: ".04em", marginBottom: 8 }}>Historial de reportes — {scope === "todas" ? "Auditor" : scope}</div>
        {misReportes.length === 0 ? (
          <div style={{ fontSize: 11.5, color: P.t4 }}>Todavía no se generaron reportes para este alcance en la sesión.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {misReportes.map((r, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 11, padding: "6px 0", borderTop: i ? `1px solid ${P.bd}` : "none" }}>
                <span className="nx-num" style={{ color: P.t4, flexShrink: 0 }}>{r.fecha}</span>
                <span style={{ color: P.t2, flex: 1 }}>{r.total} recursos · {r.avalados} avalados · {r.pct}% cumplimiento</span>
                <CsvDownloadButton csv={r.csv} filename={`reporte-semanal-${scope === "todas" ? "auditor" : scope.replace(/[^a-zA-Z0-9]+/g, "-")}-${r.fecha.replace(/\//g, "-")}.csv`} />
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// SECTION: DEMO INTERACTIVO
// ═══════════════════════════════════════════════════════════════════
const TABS_BY_ROLE = {
  "Administrador": [["dashboard", "▣ Dashboard"], ["personal", "◉ Personal"], ["validar", "☑ Validar Docs"], ["subcontratos", "◈ Subcontratos"], ["usuarios", "⚿ Usuarios"], ["acciones", "◆ Plan de Acción"], ["alertas", "△ Alertas"], ["reportes", "▥ Reportes"]],
  "Auditor": [["dashboard", "▣ Dashboard"], ["validar", "☑ Validar Docs"], ["alertas", "△ Alertas"], ["reportes", "▥ Reportes"]],
  "Empresa": [["dashboard", "▣ Dashboard"], ["personal", "◉ Personal"], ["subcontratos", "◈ Subcontratos"], ["acciones", "◆ Plan de Acción"], ["alertas", "△ Alertas"], ["reportes", "▥ Reportes"]],
  "Inspector YPF": [["dashboard", "▣ Dashboard"], ["ospe", "▤ OS / PE"], ["subcontratos", "◈ Subcontratos"]],
};

const DemoView = () => {
  const [session, setSession] = useState(() => loadLS("nexusDemo.session", null));
  const [personal, setPersonal] = useState(() => loadLS("nexusDemo.personal", SEED_PERSONAL));
  const [usuarios, setUsuarios] = useState(() => loadLS("nexusDemo.usuarios", SEED_USUARIOS));
  const [ospe, setOspe] = useState(() => loadLS("nexusDemo.ospe", SEED_OSPE));
  const [acciones, setAcciones] = useState(() => loadLS("nexusDemo.acciones", SEED_ACCIONES));
  const [subcontratos, setSubcontratos] = useState(() => loadLS("nexusDemo.subcontratos", SEED_SUBCONTRATOS));
  const [reportes, setReportes] = useState(() => loadLS("nexusDemo.reportes", []));
  const [historial, setHistorial] = useState(() => loadLS("nexusDemo.historial", SEED_HISTORIAL_CUMPLIMIENTO));
  const [log, setLog] = useState(() => loadLS("nexusDemo.log", []));

  const [tab, setTab] = useState("dashboard");
  const [tabLoading, setTabLoading] = useState(false);
  const [sessionBusy, setSessionBusy] = useState(false);
  const [enviandoReportes, setEnviandoReportes] = useState(false);
  const [modal, setModal] = useState(null); // null | 'addRecurso' | 'addUsuario' | 'manageFiles' | 'addAccion' | 'addSubcontrato'
  const [modalTarget, setModalTarget] = useState(null);
  const [modalBusy, setModalBusy] = useState(false);
  const [rowBusy, setRowBusy] = useState(null);
  const [justAddedId, setJustAddedId] = useState(null);
  const loadedTabs = useRef(new Set());

  useEffect(() => saveLS("nexusDemo.session", session), [session]);
  useEffect(() => saveLS("nexusDemo.personal", personal), [personal]);
  useEffect(() => saveLS("nexusDemo.usuarios", usuarios), [usuarios]);
  useEffect(() => saveLS("nexusDemo.ospe", ospe), [ospe]);
  useEffect(() => saveLS("nexusDemo.acciones", acciones), [acciones]);
  useEffect(() => saveLS("nexusDemo.subcontratos", subcontratos), [subcontratos]);
  useEffect(() => saveLS("nexusDemo.reportes", reportes), [reportes]);
  useEffect(() => saveLS("nexusDemo.historial", historial), [historial]);
  useEffect(() => saveLS("nexusDemo.log", log), [log]);

  const addLog = (detail) => {
    const ts = new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    setLog(prev => [{ ts, detail }, ...prev].slice(0, 20));
  };

  const handleLogin = (rolKey, usuarioObj, empresaName) => {
    setSessionBusy(true);
    setTimeout(() => {
      setSession({ rol: rolKey, nombre: usuarioObj ? usuarioObj.nombre : rolKey, usuario: usuarioObj ? usuarioObj.usuario : rolKey.toLowerCase(), empresa: empresaName });
      loadedTabs.current = new Set(["dashboard"]);
      setTab("dashboard");
      setSessionBusy(false);
    }, 650);
  };

  const handleLogout = () => { setSession(null); setModal(null); };

  const handleTabChange = (k) => {
    if (k === tab) return;
    if (!loadedTabs.current.has(k)) {
      setTabLoading(true);
      loadedTabs.current.add(k);
      setTimeout(() => { setTab(k); setTabLoading(false); }, 400);
    } else {
      setTab(k);
    }
  };

  const empresaFiltro = session && session.rol === "Empresa" ? session.empresa : null;
  const personalScoped = useMemo(() => empresaFiltro ? personal.filter(p => p.emp === empresaFiltro) : personal, [personal, empresaFiltro]);
  const empresasScoped = useMemo(() => empresaFiltro ? EMPRESAS_DATA.filter(e => e.nombre === empresaFiltro) : EMPRESAS_DATA, [empresaFiltro]);

  const addRecurso = (data) => {
    setModalBusy(true);
    setTimeout(() => {
      const id = Date.now();
      setPersonal(prev => [...prev, { id, estado: "Nuevo", cred: false, ...data }]);
      addLog(`Alta de recurso: ${data.nombre} (${data.emp}).`);
      setModalBusy(false);
      setModal(null);
      setJustAddedId(id);
      setTimeout(() => setJustAddedId(null), 1600);
      if (!TABS_BY_ROLE[session.rol].some(t => t[0] === "personal")) return;
      handleTabChange("personal");
    }, 500);
  };

  const addUsuario = (data) => {
    setModalBusy(true);
    setTimeout(() => {
      setUsuarios(prev => [...prev, { id: Date.now(), ...data }]);
      addLog(`Usuario creado: ${data.usuario} (${data.rol}).`);
      setModalBusy(false);
      setModal(null);
    }, 500);
  };

  const toggleUsuario = (id) => {
    setUsuarios(prev => prev.map(u => {
      if (u.id !== id) return u;
      const next = { ...u, activo: !u.activo };
      addLog(`Usuario ${u.usuario} ${next.activo ? "activado" : "desactivado"}.`);
      if (!next.activo && session && session.usuario === u.usuario) {
        setTimeout(() => handleLogout(), 300);
      }
      return next;
    }));
  };

  const nextEstado = (estado) => estado === "Nuevo" ? "Pend. Inspector" : "Avalado";

  const advancePersonal = (id) => {
    setRowBusy(id);
    setTimeout(() => {
      setPersonal(prev => prev.map(p => {
        if (p.id !== id) return p;
        const ne = nextEstado(p.estado);
        addLog(`${p.nombre}: ${p.estado} → ${ne}.`);
        return { ...p, estado: ne, cred: ne === "Avalado" ? true : p.cred };
      }));
      setRowBusy(null);
    }, 450);
  };

  const rejectPersonal = (id) => {
    setRowBusy(id);
    setTimeout(() => {
      setPersonal(prev => prev.map(p => {
        if (p.id !== id) return p;
        addLog(`${p.nombre}: rechazado.`);
        return { ...p, estado: "Rechazado" };
      }));
      setRowBusy(null);
    }, 450);
  };

  const approveOspe = (id) => {
    setRowBusy(id);
    setTimeout(() => {
      setOspe(prev => prev.map(o => o.id === id ? { ...o, estado: "Aprobada" } : o));
      setRowBusy(null);
    }, 450);
  };

  const attachFiles = (id, newFiles) => {
    setPersonal(prev => prev.map(p => p.id === id ? { ...p, archivos: [...(p.archivos || []), ...newFiles] } : p));
    const rec = personal.find(p => p.id === id);
    if (rec) addLog(`${rec.nombre}: ${newFiles.length} archivo${newFiles.length > 1 ? "s" : ""} adjuntado${newFiles.length > 1 ? "s" : ""}.`);
  };

  const removeFile = (id, idx) => {
    setPersonal(prev => prev.map(p => p.id === id ? { ...p, archivos: (p.archivos || []).filter((_, i) => i !== idx) } : p));
  };

  const reviewFile = (id, idx, estado, comentario) => {
    const rec = personal.find(p => p.id === id);
    const nombreArchivo = rec && (rec.archivos || [])[idx] ? rec.archivos[idx].name : "documento";
    setPersonal(prev => prev.map(p => {
      if (p.id !== id) return p;
      const archivos = (p.archivos || []).map((f, i) => i === idx
        ? { ...f, revision: { estado, comentario, revisor: session.nombre, fecha: new Date().toLocaleDateString("es-AR") } }
        : f);
      return { ...p, archivos };
    }));
    addLog(`${rec ? rec.nombre : ""}: "${nombreArchivo}" → ${estado}${comentario ? ` — "${comentario}"` : ""}.`);
  };

  const addAccion = (data) => {
    setModalBusy(true);
    setTimeout(() => {
      setAcciones(prev => [...prev, { id: Date.now(), ...data }]);
      addLog(`Nueva acción: "${data.ac}" (${data.emp}).`);
      setModalBusy(false);
      setModal(null);
    }, 450);
  };

  const toggleAccionEstado = (id) => {
    const NEXT = { "Pendiente": "En curso", "En curso": "Hecho", "Hecho": "Pendiente" };
    setAcciones(prev => prev.map(a => {
      if (a.id !== id) return a;
      const ne = NEXT[a.estado];
      addLog(`Acción "${a.ac}": ${a.estado} → ${ne}.`);
      return { ...a, estado: ne };
    }));
  };

  const addSubcontrato = (data) => {
    setModalBusy(true);
    setTimeout(() => {
      setSubcontratos(prev => [...prev, {
        id: Date.now(), ...data, estado: "Pendiente Inspector",
        solicitante: session.nombre, fecha: new Date().toISOString().slice(0, 10), notificado: false,
      }]);
      addLog(`Comunicación de Subcontratación enviada: ${data.razonSocial} (${data.empresaPrincipal}) — pendiente de aprobación del Inspector.`);
      setModalBusy(false);
      setModal(null);
    }, 500);
  };

  const approveSubcontrato = (id) => {
    setRowBusy(id);
    setTimeout(() => {
      setSubcontratos(prev => prev.map(s => s.id === id ? { ...s, estado: "Aprobada", notificado: true } : s));
      const s = subcontratos.find(x => x.id === id);
      if (s) addLog(`Subcontratación de ${s.razonSocial} aprobada. Notificación automática enviada a Responsable Técnico y Administrativo de ${s.empresaPrincipal}.`);
      setRowBusy(null);
    }, 500);
  };

  const rejectSubcontrato = (id, motivo) => {
    setRowBusy(id);
    setTimeout(() => {
      setSubcontratos(prev => prev.map(s => s.id === id ? { ...s, estado: "Rechazada", motivo } : s));
      const s = subcontratos.find(x => x.id === id);
      if (s) addLog(`Subcontratación de ${s.razonSocial} rechazada — "${motivo}".`);
      setRowBusy(null);
    }, 500);
  };

  const buildReporte = (scopeKey) => {
    const scoped = scopeKey === "todas" ? personal : personal.filter(p => p.emp === scopeKey);
    const total = scoped.length;
    const avalados = scoped.filter(p => p.estado === "Avalado").length;
    const pendientes = scoped.filter(p => p.estado === "Nuevo" || p.estado === "Pend. Inspector").length;
    const rechazados = scoped.filter(p => p.estado === "Rechazado").length;
    const pct = total ? Math.round((avalados / total) * 100) : 0;
    const recs = generarRecomendaciones(scoped, pct, TARGET_CUMPLIMIENTO);
    const plan = proximaSemanaAcciones(acciones, scopeKey === "todas" ? null : scopeKey);
    const rows = [
      [`Reporte Semanal de Compliance — ${scopeKey === "todas" ? "Auditor (todas las empresas)" : `Cliente — ${scopeKey}`}`],
      ["Generado", new Date().toLocaleString("es-AR")],
      [],
      ["Recursos totales", total],
      ["Avalados", avalados],
      ["Pendientes", pendientes],
      ["Rechazados", rechazados],
      ["Cumplimiento (%)", pct],
      ["Meta (%)", TARGET_CUMPLIMIENTO],
      [],
      ["Recomendaciones"],
      ...recs.map(r => [r.texto]),
      [],
      ["Planificación — próximos 7 días"],
      ...(plan.length ? plan.map(a => [a.ac, a.resp, a.v, a.diffDays < 0 ? "Vencida" : `En ${a.diffDays}d`]) : [["Sin acciones previstas"]]),
      [],
      ["Nombre", "Empresa", "Rol", "Estado", "ART (días)", "Apto (días)"],
      ...scoped.map(p => [p.nombre, p.emp, p.rol, p.estado, p.art, p.apto]),
    ];
    return { fecha: new Date().toLocaleDateString("es-AR"), empresa: scopeKey, total, avalados, pct, csv: rowsToCsv(rows) };
  };

  const generarReporte = (scopeKey) => {
    const r = buildReporte(scopeKey);
    setReportes(prev => [r, ...prev].slice(0, 30));
    setHistorial(prev => ({ ...prev, [scopeKey]: [...(prev[scopeKey] || []), r.pct].slice(-8) }));
    addLog(`Reporte semanal generado (${scopeKey === "todas" ? "Auditor" : scopeKey}): ${r.avalados}/${r.total} avalados (${r.pct}% cumplimiento).`);
  };

  const enviarReportesSemanales = () => {
    setEnviandoReportes(true);
    setTimeout(() => {
      const nuevos = EMPRESAS_DATA.map(e => buildReporte(e.nombre));
      setReportes(prev => [...nuevos, ...prev].slice(0, 30));
      setHistorial(prev => {
        const next = { ...prev };
        nuevos.forEach(r => { next[r.empresa] = [...(next[r.empresa] || []), r.pct].slice(-8); });
        return next;
      });
      addLog(`Reportes semanales enviados a ${EMPRESAS_DATA.length} subcontratos: ${EMPRESAS_DATA.map(e => e.nombre).join(", ")}.`);
      setEnviandoReportes(false);
    }, 700);
  };

  const tabs = session ? TABS_BY_ROLE[session.rol] : [];
  const canAddRecurso = session && (session.rol === "Administrador" || session.rol === "Empresa");

  return (
    <div style={{ minHeight: "100vh", padding: "80px 40px", position: "relative" }}>
      <div style={{ maxWidth: 1200, width: "100%", margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24, flexWrap: "wrap" }}>
          <Badge c={P.ac}>Demo en Vivo</Badge>
          <span style={{ fontSize: 13, color: P.t3 }}>{session ? `Vista ${session.rol}` : "Login por rol"} · Datos de ejemplo</span>
        </div>

        <div style={{ background: P.sf, border: `1px solid ${P.bd}`, borderRadius: 12, overflow: "hidden", boxShadow: `0 0 80px ${P.ac}08` }}>
          <div style={{ display: "flex", alignItems: "center", padding: "10px 18px", borderBottom: `1px solid ${P.bd}`, background: P.bg2, gap: 12 }}>
            <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
              <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#FF5F57" }} />
              <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#FFBD2E" }} />
              <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#28C840" }} />
            </div>
            <span style={{ fontSize: 11, color: P.t4, flex: 1, textAlign: "center" }}>nexus-empresarial.app — Panel de Control</span>
            <div style={{ flexShrink: 0 }}>{session && <SessionChip session={session} onLogout={handleLogout} />}</div>
          </div>

          {session && (
            <div style={{ display: "flex", gap: 0, borderBottom: `1px solid ${P.bd}`, overflowX: "auto" }}>
              {tabs.map(([k, l]) => (
                <div key={k} onClick={() => handleTabChange(k)} className="nx-btn" style={{
                  padding: "10px 20px", fontSize: 12, cursor: "pointer", whiteSpace: "nowrap",
                  color: tab === k ? P.ac : P.t3, fontWeight: tab === k ? 600 : 400,
                  borderBottom: tab === k ? `2px solid ${P.ac}` : "2px solid transparent",
                  background: tab === k ? P.ac2 : "transparent",
                }}>{l}</div>
              ))}
            </div>
          )}

          <div style={{ padding: 20, minHeight: 440 }}>
            {!session && <LoginGate usuarios={usuarios} onLogin={handleLogin} busy={sessionBusy} />}
            {session && tabLoading && <ProgressPulse label="Cargando datos…" />}
            {session && !tabLoading && tab === "dashboard" && (
              <DashboardTab
                personal={personalScoped} empresas={empresasScoped}
                canReport={TABS_BY_ROLE[session.rol].some(t => t[0] === "reportes")}
                onOpenReportes={() => handleTabChange("reportes")}
              />
            )}
            {session && !tabLoading && tab === "personal" && <PersonalTab personal={personalScoped} canAdd={canAddRecurso} onAddClick={() => setModal("addRecurso")} justAddedId={justAddedId} onManageFiles={(id) => { setModalTarget(id); setModal("manageFiles"); }} />}
            {session && !tabLoading && tab === "validar" && <ValidarTab personal={session.rol === "Auditor" ? personal : personalScoped} onAdvance={advancePersonal} onReject={rejectPersonal} busyId={rowBusy} log={log} />}
            {session && !tabLoading && tab === "usuarios" && <UsuariosTab usuarios={usuarios} onToggle={toggleUsuario} onAddClick={() => setModal("addUsuario")} />}
            {session && !tabLoading && tab === "ospe" && <OspeTab ospe={ospe} onApprove={approveOspe} busyId={rowBusy} />}
            {session && !tabLoading && tab === "subcontratos" && (
              <SubcontratosTab
                subcontratos={subcontratos} empresaFiltro={empresaFiltro}
                canRequest={session.rol === "Administrador" || session.rol === "Empresa"}
                canApprove={session.rol === "Inspector YPF"}
                onAddClick={() => setModal("addSubcontrato")}
                onApprove={approveSubcontrato} onReject={rejectSubcontrato} busyId={rowBusy}
              />
            )}
            {session && !tabLoading && tab === "acciones" && (
              <AccionesTab
                acciones={acciones} empresaFiltro={empresaFiltro}
                canManage={session.rol === "Administrador" || session.rol === "Empresa"}
                onAddClick={() => setModal("addAccion")} onToggleEstado={toggleAccionEstado}
              />
            )}
            {session && !tabLoading && tab === "alertas" && <AlertasTab personal={personalScoped} empresaFiltro={empresaFiltro} />}
            {session && !tabLoading && tab === "reportes" && (
              <ReportesTab
                personal={personal} acciones={acciones} role={session.rol} sessionEmpresa={session.empresa}
                historial={historial} reportes={reportes} onGenerar={generarReporte}
                onEnviar={enviarReportesSemanales} busyEnviar={enviandoReportes}
              />
            )}
          </div>
        </div>
      </div>

      {modal === "addRecurso" && (
        <Modal title="Agregar Recurso" accent={P.ac} onClose={() => !modalBusy && setModal(null)}>
          <ResourceForm fixedEmpresa={session.rol === "Empresa" ? session.empresa : null} onSubmit={addRecurso} onClose={() => setModal(null)} busy={modalBusy} />
        </Modal>
      )}
      {modal === "addUsuario" && (
        <Modal title="Nuevo Usuario" accent={P.vi} onClose={() => !modalBusy && setModal(null)}>
          <UserForm onSubmit={addUsuario} onClose={() => setModal(null)} busy={modalBusy} />
        </Modal>
      )}
      {modal === "addAccion" && (
        <Modal title="Nueva Acción" accent={P.am} onClose={() => !modalBusy && setModal(null)}>
          <ActionForm fixedEmpresa={session.rol === "Empresa" ? session.empresa : null} onSubmit={addAccion} onClose={() => setModal(null)} busy={modalBusy} />
        </Modal>
      )}
      {modal === "addSubcontrato" && (
        <Modal title="Comunicación de Subcontratación" accent={P.vi} onClose={() => !modalBusy && setModal(null)}>
          <SubcontratoForm fixedEmpresa={session.rol === "Empresa" ? session.empresa : null} onSubmit={addSubcontrato} onClose={() => setModal(null)} busy={modalBusy} />
        </Modal>
      )}
      {modal === "manageFiles" && modalTarget && (() => {
        const rec = personal.find(p => p.id === modalTarget);
        if (!rec) return null;
        return (
          <Modal title={`Documentos — ${rec.nombre}`} accent={P.bl} onClose={() => { setModal(null); setModalTarget(null); }}>
            <FileAttach
              files={rec.archivos || []}
              onAdd={f => attachFiles(modalTarget, f)}
              onRemove={i => removeFile(modalTarget, i)}
              canReview={session.rol === "Administrador" || session.rol === "Auditor"}
              onReview={(idx, estado, comentario) => reviewFile(modalTarget, idx, estado, comentario)}
            />
          </Modal>
        );
      })()}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// MAIN APP — scroll-based sections
// ═══════════════════════════════════════════════════════════════════
const SECTIONS = [
  { id: "hero", label: "Inicio" },
  { id: "problema", label: "Desafío" },
  { id: "solucion", label: "Solución" },
  { id: "empresas", label: "Subcontratos" },
  { id: "modulos", label: "Módulos" },
  { id: "roles", label: "Roles" },
  { id: "src", label: "SRC Map" },
  { id: "demo", label: "Demo" },
  { id: "cta", label: "Cierre" },
];

function App() {
  const [section, setSection] = useState("hero");
  const [mode, setMode] = useState(() => loadLS("nexusDemo.themeMode", "dark"));
  const mainRef = useRef(null);

  // Reescribe la paleta compartida ANTES de que se rendericen los hijos,
  // así todo el árbol (marketing + demo) toma el estilo elegido.
  Object.assign(P, mode === "light" ? LIGHT_PALETTE : DARK_PALETTE);

  useEffect(() => {
    saveLS("nexusDemo.themeMode", mode);
    document.body.setAttribute("data-nx-mode", mode);
  }, [mode]);

  const toggleMode = () => setMode(m => (m === "light" ? "dark" : "light"));

  const scrollTo = useCallback((id) => {
    const el = document.getElementById(`section-${id}`);
    if (el) el.scrollIntoView({ behavior: "smooth" });
    setSection(id);
  }, []);

  useEffect(() => {
    const main = mainRef.current;
    if (!main) return;
    const handler = () => {
      const scrollTop = main.scrollTop;
      let cur = "hero";
      SECTIONS.forEach(s => {
        const el = document.getElementById(`section-${s.id}`);
        if (el && el.offsetTop - 80 <= scrollTop) cur = s.id;
      });
      setSection(cur);
    };
    main.addEventListener("scroll", handler, { passive: true });
    return () => main.removeEventListener("scroll", handler);
  }, []);

  const goNext = (target) => scrollTo(target || "problema");

  return (
    <div style={{ height: "100vh", background: P.bg, color: P.t, fontFamily: "var(--font-display)", overflow: "hidden" }}>
      <TopBar section={section} setSection={scrollTo} sections={SECTIONS} mode={mode} onToggleMode={toggleMode} />
      <div ref={mainRef} className="nx-scroll" style={{ height: "100vh", overflowY: "auto", paddingTop: 52 }}>
        <div id="section-hero"><Hero onNext={goNext} /></div>
        <div id="section-problema"><Problema /></div>
        <div id="section-solucion"><Solucion /></div>
        <div id="section-empresas"><Empresas /></div>
        <div id="section-modulos"><Modulos /></div>
        <div id="section-roles"><Roles /></div>
        <div id="section-src"><SRCMap /></div>
        <div id="section-demo"><DemoView /></div>
        <div id="section-cta"><CTA /></div>
        <div style={{ height: 60 }} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DownloadsProvider><App /></DownloadsProvider>);
</script>
